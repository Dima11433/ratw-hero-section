<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  <!-- Stylized Elegant "R" -->
  <text x="256" y="330" font-family="'Playfair Display', Georgia, serif" font-size="280" font-style="italic" font-weight="600" fill="url(#accent)" text-anchor="middle">R</text>
  <!-- Accent Dot -->
  <circle cx="370" cy="190" r="14" fill="#10b981"/>
</svg>
